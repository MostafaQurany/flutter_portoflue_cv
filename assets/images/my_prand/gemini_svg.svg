<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Cyan gradient for the M -->
    <linearGradient id="gradM" x1="96" y1="170" x2="256" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    
    <!-- Silver/White gradient for the Q -->
    <linearGradient id="gradQ" x1="222" y1="186" x2="416" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Subtle Developer Dot Grid -->
    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.5" fill="#1E293B" opacity="0.8" />
    </pattern>
  </defs>

  <!-- Outer Shape (Darkest Background) -->
  <rect x="0" y="0" width="512" height="512" rx="128" fill="#070B12" />
  
  <!-- Inner Surface (Card layer) -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="#0B1220" stroke="#1E293B" stroke-width="4"/>
  
  <!-- Grid Overlay -->
  <rect x="22" y="22" width="468" height="468" rx="106" fill="url(#dotGrid)" />

  <!-- Monogram Group -->
  <g fill="none">
    <!-- Q Loop -->
    <circle cx="306" cy="270" r="84" stroke="url(#gradQ)" stroke-width="44" />
    
    <!-- Q Tail -->
    <path d="M 365 329 L 416 380" stroke="url(#gradQ)" stroke-width="44" stroke-linecap="round" />

    <!-- M Cutout (This creates the beautiful negative space gap over the Q) -->
    <path d="M 96 360 V 170 L 176 260 L 256 170 V 360" stroke="#0B1220" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- M Main -->
    <path d="M 96 360 V 170 L 176 260 L 256 170 V 360" stroke="url(#gradM)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Clean Architecture Accents (Nodes) -->
  <circle cx="306" cy="270" r="12" fill="#38BDF8" />
  <circle cx="176" cy="200" r="12" fill="#94A3B8" />

</svg>
